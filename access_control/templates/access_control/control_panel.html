{% extends 'access_control/base.html' %}
{% load static %}

{% block link %}
    <link rel="stylesheet" href="{% static 'access_control/css/dashboard.css'%} ">
{% endblock link %}

{% block content %}

    <div class="dashboard">
        {{ block.super }}
        <main class="content">

            <section class="video-section glass-card fade-in">
                <div class="section-header">
                    <h3>Видеопоток</h3>
                </div>

                <div class="video-wrapper">
                    <img
                        src="{% url 'camera_stream:camera_stream' %}"
                        alt="Видеопоток"
                        class="video-stream"
                    >
                </div>
            </section>

            <section class="manual-section glass-card fade-in">
                <div class="section-header">
                    <h3>Ручная обработка</h3>
                </div>

                <div id="license_plates_for_manual_handle_list"
                     class="plate-list">
                </div>
            </section>

            <section class="logs-section glass-card fade-in">
                {% include 'access_control/log_table.html' %}
            </section>

        </main>

    </div>
{% endblock %}
{% block scripts %}
    <script>

        async function sendResponse(url, jsonDecode = true) {
            const response = await fetch(url)

            if (response.ok && jsonDecode) {
                try {
                    return await response.json()
                } catch (e) {
                    console.error(
                        `Ошибка во время запроса по адресу: ${url}`
                    )
                }
            }
        }

        async function loadLicensePlatesForManualHandle() {
            const data = await sendResponse(
                '/license_plates/for_manual_handle/'
            )

            if (data) {
                await rebuildLicensePlatesForManual(
                    data.result
                )
            }
        }

        async function rebuildLicensePlatesForManual(data) {

            const existingCards = new Map(
                [...licensePlatesForManualHandleList.children]
                    .map(el => [el.dataset.id, el])
            )

            const incomingIds = new Set()

            data.forEach((record) => {

                const plate = record[0]
                const id = String(record[1])

                incomingIds.add(id)

                if (existingCards.has(id)) {
                    return
                }

                const wrapper = document.createElement('div')
                wrapper.className = 'plate-card'
                wrapper.dataset.id = id

                const plateElement =
                    document.createElement('div')

                plateElement.className =
                    'plate-number'

                plateElement.textContent = plate

                const buttons =
                    document.createElement('div')

                buttons.className =
                    'plate-actions'

                const allowButton =
                    document.createElement('button')

                allowButton.className =
                    'btn btn-success'

                allowButton.textContent =
                    'Допустить'

                const rejectButton =
                    document.createElement('button')

                rejectButton.className =
                    'btn btn-danger'

                rejectButton.textContent =
                    'Отклонить'

                allowButton.addEventListener(
                    'click',
                    () => {
                        handleLicensePlate(
                            id,
                            true,
                            wrapper
                        )
                    }
                )

                rejectButton.addEventListener(
                    'click',
                    () => {
                        handleLicensePlate(
                            id,
                            false,
                            wrapper
                        )
                    }
                )

                buttons.appendChild(
                    allowButton
                )

                buttons.appendChild(
                    rejectButton
                )

                wrapper.appendChild(
                    plateElement
                )

                wrapper.appendChild(
                    buttons
                )

                licensePlatesForManualHandleList
                    .appendChild(wrapper)
            })

            existingCards.forEach(
                (element, id) => {

                    if (!incomingIds.has(id)) {

                        element.classList.add(
                            'removing'
                        )

                        setTimeout(() => {
                            element.remove()
                        }, 250)
                    }
                }
            )
        }

        async function handleLicensePlate(
            licensePlateManualId,
            status,
            container
        ) {

            const action =
                status ? 'allow' : 'reject'

            const response = await fetch(
                `/license_plates/for_manual_handle/${licensePlateManualId}/${action}/`
            )

            if (response.status === 204) {

                container.classList.add(
                    'removing'
                )

                setTimeout(() => {
                    container.remove()
                }, 250)
            }
        }

        const
            licensePlatesForManualHandleList =
            document.getElementById(
                'license_plates_for_manual_handle_list'
            )

        loadLicensePlatesForManualHandle()

        setInterval(
            loadLicensePlatesForManualHandle,
            10000
        )

    </script>
{% endblock scripts %}
