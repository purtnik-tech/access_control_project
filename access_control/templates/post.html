<!-- templates/post.html -->
{% extends "base.html" %}
{% block title %}Пост охраны{% endblock %}
{% block content %}
<div class="container">
    <h1>Пост охраны</h1>
    <div class="video-box">
        <img id="video-feed" src="{% url 'video_feed' %}" width="640" height="480" alt="Видеопоток">
        <div id="recognized-plate" class="plate-display">Номер не распознан</div>
    </div>
    <div class="controls">
        <button id="add-pass" class="btn btn-primary">Добавить пропуск</button>
        <button id="allow-access" class="btn btn-success">Допустить</button>
        <button id="deny-access" class="btn btn-danger">Запретить</button>
    </div>
    <div id="message" class="message"></div>
</div>

<script>
    // Периодически опрашиваем сервер о последнем распознанном номере
    setInterval(async () => {
        try {
            const resp = await fetch('/status/');
            const data = await resp.json();
            document.getElementById('recognized-plate').innerText = data.plate || 'Номер не распознан';
            document.getElementById('recognized-plate').dataset.plate = data.plate || '';
        } catch (e) {
            console.error('Ошибка получения статуса');
        }
    }, 1000);

    // Обработчики кнопок
    document.getElementById('add-pass').addEventListener('click', () => {
        const plate = document.getElementById('recognized-plate').dataset.plate;
        if (!plate) return alert('Номер не распознан');
        fetch('/add-pass/', {
            method: 'POST',
            headers: {'X-CSRFToken': '{{ csrf_token }}', 'Content-Type': 'application/json'},
            body: JSON.stringify({plate: plate})
        }).then(r => r.json()).then(d => showMessage(d.status));
    });

    document.getElementById('allow-access').addEventListener('click', () => {
        const plate = document.getElementById('recognized-plate').dataset.plate;
        if (!plate) return alert('Номер не распознан');
        fetch('/allow-access/', {
            method: 'POST',
            headers: {'X-CSRFToken': '{{ csrf_token }}', 'Content-Type': 'application/json'},
            body: JSON.stringify({plate: plate})
        }).then(r => r.json()).then(d => showMessage(d.status));
    });

    document.getElementById('deny-access').addEventListener('click', () => {
        const plate = document.getElementById('recognized-plate').dataset.plate;
        if (!plate) return alert('Номер не распознан');
        fetch('/deny-access/', {
            method: 'POST',
            headers: {'X-CSRFToken': '{{ csrf_token }}', 'Content-Type': 'application/json'},
            body: JSON.stringify({plate: plate})
        }).then(r => r.json()).then(d => showMessage(d.status));
    });

    function showMessage(msg) {
        const el = document.getElementById('message');
        el.innerText = msg;
        setTimeout(() => el.innerText = '', 3000);
    }
</script>
{% endblock %}
